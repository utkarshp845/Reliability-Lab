# Minimal local OpenTelemetry Collector config for the optional signal path.
#
# Scope is intentionally small: receive the OTLP/HTTP logs demo-service and
# ai-sre-assistant already emit (see docs/04-observability-basics.md and
# docs/23-otel-collector-path.md), batch them, and print what arrived. There
# is no backend export here on purpose - that is a later, separate step once
# a real backend is chosen (docs/18-production-observability.md, migration
# step 4). The point of this step is only to prove the signal path works.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
