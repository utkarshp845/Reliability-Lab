# Optional overlay that adds Prometheus and Grafana, scraping the
# Prometheus-format /metrics endpoints both services already expose. The
# default quickstart (`make up`) never loads this file.
#
# Usage:
#   make dashboard-up
#   make dashboard-logs   # watch scrape and rule evaluation
#   make dashboard-down
#
# Or directly:
#   docker compose -f docker-compose.yml -f infra/docker/docker-compose.dashboard.yml up --build -d
#
# See docs/24-dashboard-and-alert.md for what this demonstrates, the one
# alert it ships, and why the default path does not require it.

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: aiops-prometheus
    volumes:
      - ./infra/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/docker/prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: aiops-grafana
    environment:
      # Anonymous viewer access is a local-only convenience for this teaching
      # lab so the dashboard is one click away. Do not carry this setting to
      # any Grafana instance reachable outside your own machine.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./infra/docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
