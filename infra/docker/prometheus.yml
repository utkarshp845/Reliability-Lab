# Minimal local Prometheus config for the optional dashboard/alert path.
#
# Scrapes the Prometheus-format /metrics endpoints both services already
# expose (see docs/04-observability-basics.md) directly - no collector, no
# new instrumentation. See docs/24-dashboard-and-alert.md.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: demo-service
    static_configs:
      - targets: ["demo-service:8000"]

  - job_name: ai-sre-assistant
    static_configs:
      - targets: ["ai-sre-assistant:8001"]
